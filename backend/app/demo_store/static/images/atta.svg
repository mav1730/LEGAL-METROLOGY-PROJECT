  <text x="200" y="260" font-family="'Outfit', sans-serif" font-weight="800" font-size="12" fill="#fef08a" text-anchor="middle">100% WHOLE WHEAT ATTA</text>
  <text x="200" y="278" font-family="'Outfit', sans-serif" font-weight="600" font-size="10" fill="#fef9c3" text-anchor="middle">Chakki Fresh Stone Ground</text>
